services:
  - type: web
    name: odysseus-ochtrup-concept
    runtime: static
    buildCommand: echo "Static site ready"
    staticPublishPath: .
    autoDeploy: true
    routes:
      - type: rewrite
        source: /speisekarte
        destination: /speisekarte.html
      - type: rewrite
        source: /reservieren
        destination: /reservieren.html
      - type: rewrite
        source: /restaurant
        destination: /restaurant.html
      - type: rewrite
        source: /rechtliches
        destination: /rechtliches.html
